<!DOCTYPE html><html lang="ur"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#060813">
<title>SHAHZAD MINI BOT | Premium Panel</title>
<link rel="stylesheet" href="ajax/libs/font-awesome/6.6.0/css/all.min.css">
<link href="_assets/fonts.googleapis.com_css2.bin" rel="stylesheet">
<style>
:root{
  --bg:#060813;--card:rgba(255,255,255,.045);--tile:rgba(255,255,255,.045);--line:rgba(255,255,255,.09);
  --text:#f3f6fd;--muted:#97a3bd;--label:#a5b0c8;
  --green:#34d399;--red:#fb7185;--amber:#fbbf24;
  --ac:#fbbf24;--ac-rgb:251,191,36;--ac2:#f97316;--ac2-rgb:249,115,22;--ac3:#ef4444;
  --grad:linear-gradient(135deg,#f59e0b,#fbbf24 55%,#fde68a);
  --lift:0 14px 36px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.07),0 0 0 1px var(--line);
  --dent:inset 0 2px 8px rgba(0,0,0,.4),0 0 0 1px rgba(255,255,255,.06);
  --font:Manrope,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;--mono:'JetBrains Mono',ui-monospace,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg);scroll-behavior:smooth}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--text);font-family:var(--font);background:transparent;position:relative;
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 48px)}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:radial-gradient(60% 45% at 12% -5%,rgba(251,191,36,.18),transparent 70%),radial-gradient(50% 40% at 105% 20%,rgba(249,115,22,.15),transparent 70%),var(--bg)}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.wrap{max-width:560px;margin:0 auto}
.hidden{display:none!important}
.mono{font-family:var(--mono)}
.top{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.brand{display:flex;align-items:center;gap:12px;flex:1;min-width:0}
.brand img{width:46px;height:46px;border-radius:15px;object-fit:cover;box-shadow:0 0 0 2px rgba(251,191,36,.55),0 8px 22px rgba(249,115,22,.4)}
.brand b{display:flex;align-items:center;gap:6px;font-size:.98rem;font-weight:800}
.brand small{display:block;margin-top:3px;font-size:.62rem;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.vbadge{width:18px;height:18px;flex:none}
.sq{display:grid;place-items:center;flex:none;width:46px;height:46px;border:0;border-radius:16px;font-size:1.05rem;color:var(--text);background:var(--card);box-shadow:var(--lift);text-decoration:none}
.card{position:relative;margin-bottom:16px;padding:20px;border-radius:28px;background:var(--card);box-shadow:var(--lift)}
.title{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 14px;font-size:.78rem;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--label)}
.title i{color:var(--amber)}
.btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;min-height:58px;padding:0 20px;border:0;border-radius:20px;font-size:.92rem;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:#2a1c00;background:var(--grad);box-shadow:0 14px 30px rgba(251,191,36,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.field{display:flex;align-items:center;gap:10px;height:56px;padding:0 16px;margin-bottom:12px;border-radius:18px;background:rgba(0,0,0,.22);box-shadow:var(--dent)}
.field i{color:var(--amber)}
.field input{flex:1;min-width:0;height:100%;border:0;outline:0;background:transparent;font-size:1rem;font-weight:600}
.footer{margin-top:26px;text-align:center;font-size:.78rem;color:var(--muted)}
.footer strong{color:var(--text)}
.toast{position:fixed;left:50%;bottom:28px;z-index:300;max-width:88vw;padding:14px 20px;border-radius:18px;font-size:.84rem;font-weight:700;color:#fff;background:rgba(14,18,34,.96);box-shadow:0 14px 40px rgba(0,0,0,.5);transform:translate(-50%,30px);opacity:0;visibility:hidden;transition:.3s}
.toast.on{transform:translate(-50%,0);opacity:1;visibility:visible}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="O3BUG.jpg" alt=""><div><b>SHAHZAD MINI BOT <svg class="vbadge" viewBox="0 0 24 24"><path fill="#0095F6" d="M12 1.5l2.3 1.6 2.8-.2 1.3 2.5 2.5 1.3-.2 2.8 1.6 2.3-1.6 2.3.2 2.8-2.5 1.3-1.3 2.5-2.8-.2L12 22.5l-2.3-1.6-2.8.2-1.3-2.5-2.5-1.3.2-2.8L1.7 12l1.6-2.3-.2-2.8 2.5-1.3 1.3-2.5 2.8.2z"/><path d="M7.8 12.3l2.9 2.9 5.5-5.8" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></b><small>Admin Panel</small></div></div>
    <a class="sq" href="index.html"><i class="fas fa-arrow-left"></i></a>
  </div>

  <section class="card">
    <h2 class="title"><span><i class="fas fa-crown"></i> Admin Control</span></h2>
    <div class="field"><i class="fas fa-lock"></i><input id="adminKey" type="password" placeholder="Enter admin passkey"></div>
    <button class="btn" id="loginBtn" type="button"><i class="fas fa-right-to-bracket"></i> Login Admin</button>
  </section>
  <footer class="footer">© 2026 <strong>SHAHZAD MINI BOT</strong></footer>
</div>
<div class="toast" id="toast"></div>
<script>
const $ = id => document.getElementById(id);
function showToast(msg) { const el = $('toast'); el.textContent = msg; el.classList.add('on'); setTimeout(() => el.classList.remove('on'), 2600); }
$('loginBtn').onclick = () => {
    if(!$('adminKey').value) { showToast('Please enter passkey'); return; }
    showToast('Admin login verified ✓');
};
</script>
</body></html>
